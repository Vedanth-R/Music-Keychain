# EC11 rotation support (the encoder push switch is intentionally absent).
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enter idle after 30 seconds and deep sleep after 15 minutes.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Maintained soft-power switch between P0.24 and GND.
CONFIG_ZMK_PM_SOFT_OFF=y

